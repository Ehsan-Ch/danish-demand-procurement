[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "danish-demanddesk"
version = "1.0.0"
description = "Delayed-data demand forecasts and risk-controlled paper procurement"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]
[project.scripts]
demanddesk = "demanddesk.cli:main"
[tool.setuptools.packages.find]
include = ["demanddesk*"]

